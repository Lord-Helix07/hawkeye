# nginx site for https://api.fly-hawkeye.com -> FastAPI on 127.0.0.1:8000
#
# Installed by setup_server.sh to /etc/nginx/sites-available/api.fly-hawkeye.com
# This file starts as plain HTTP. Running
#   sudo certbot --nginx -d api.fly-hawkeye.com
# adds the HTTPS (port 443) section and the HTTP->HTTPS redirect automatically.

server {
    listen 80;
    listen [::]:80;
    server_name api.fly-hawkeye.com;

    # Allow video/image uploads bigger than nginx's 1 MB default.
    client_max_body_size 100M;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket / streaming support (live telemetry, video feeds)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_buffering off;

        # YOLO processing can be slow -- don't cut long requests off at 60s.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
